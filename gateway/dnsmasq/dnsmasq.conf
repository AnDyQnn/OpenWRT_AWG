interface=br-lan
# bind-dynamic (а не bind-interfaces): dnsmasq спокойно переживает интерфейсы,
# появляющиеся позже — VLAN-сегменты br-lan.<id> (Ф4) поднимает gw-network-apply.
bind-dynamic
# Диапазон под офис: .10–.250 = ~240 адресов (хватит на 30-50 чел с запасом).
# Аренда 90 дней (§В.2, вариант A): устройство держит ТОТ ЖЕ IP, пока появляется
# в сети (dnsmasq продлевает аренду при активности) — «постоянка». Если устройства
# не было в сети 90 дней — аренда истекает, IP сам возвращается в пул («авто-чистка
# по неактивности», без отдельного кода). Вечный адрес по MAC — панель пишет
# dhcp-host= в filter/reservations.conf.
dhcp-range=192.168.88.10,192.168.88.250,90d
dhcp-option=3,192.168.88.1
# DNS клиентам = сам шлюз (наш dnsmasq), чтобы работал фильтр доступа/блокировка.
dhcp-option=6,192.168.88.1
no-resolv
server=1.1.1.1
server=8.8.8.8
log-dhcp
# Фильтр доступа: блок-лист сайтов (address=/domain/0.0.0.0). Файлы пишет
# веб-панель в общий с хостом каталог, dnsmasq их читает.
conf-dir=/etc/dnsmasq.d/filter,*.conf
