# Для проброса WebSocket (консоль шлюза): Connection: upgrade при наличии Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → редирект на HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS с самоподписанным сертификатом
server {
    listen 443 ssl default_server;
    server_name _;
    client_max_body_size 2M;

    ssl_certificate     /etc/nginx/ssl/gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Консоль шлюза — WebSocket (PTY), без буферизации, долгие соединения
    location /api/console/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Всё на FastAPI (uvicorn 127.0.0.1:8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    # Совместимость со старым адресом /awg/
    location /awg/ {
        return 301 https://$host/;
    }
}
