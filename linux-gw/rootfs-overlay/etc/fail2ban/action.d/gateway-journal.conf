# Доп.действие fail2ban: писать баны/разбаны в Журнал событий шлюза
# (/var/log/awg-watchdog.log читает вкладка «Журнал» в панели).
[Definition]
actionban   = /bin/sh -c 'printf "%%s fail2ban: ЗАБЛОКИРОВАН <ip> (перебор пароля, <name>)\n" "$(date '"'"'+%%Y-%%m-%%d %%H:%%M:%%S'"'"')" >> /var/log/awg-watchdog.log'
actionunban = /bin/sh -c 'printf "%%s fail2ban: разблокирован <ip> (<name>)\n" "$(date '"'"'+%%Y-%%m-%%d %%H:%%M:%%S'"'"')" >> /var/log/awg-watchdog.log'
actionstart =
actionstop  =
actioncheck =
