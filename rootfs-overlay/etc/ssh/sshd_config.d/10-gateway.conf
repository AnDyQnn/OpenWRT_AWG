# Gateway SSH. Доступ — из LAN и через VPN-туннель; со стороны WAN порт закрыт
# хостовым фаерволом (gw-firewall.sh).
#
# ПОРТА здесь намеренно НЕТ. Он задаётся на самом устройстве и лежит в соседнем
# 20-gateway-port.conf, которого нет в репозитории: иначе порт всех установок был
# бы опубликован в открытом коде, а накат затирал бы порт, выбранный владельцем.
# Задать: панель → Система → Безопасность → SSH-доступ, либо
#         gateway-ssh-port.sh set <порт>
PermitRootLogin yes
PasswordAuthentication yes
